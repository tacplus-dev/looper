#
# Runs the tests, then builds the looper image on every push to main (main,
# main-<sha>) and on a vX.Y.Z tag (X.Y.Z, X.Y, latest), smoke-tests it, and
# pushes it to ghcr. arm64: the build hosts (this Mac under colima, the arm64
# runner) are arm64. A failed run on main opens or updates a bug issue
# (image-failed, looper#58): a land does not wait for this build. A push does
# not cancel the running build: a run takes longer than the gap between lands
# on a busy day, so one that cancels never publishes (looper#150); the newest
# push waits, and a newer one replaces it.
name: image
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Test
        # just: tests/looper-build.test.sh runs a repository's gates with it, as the build image does.
        run: |
          command -v just >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q just; }
          tests/looper-docker.test.sh && tests/looper-pkill.test.sh && tests/forge.test.sh && tests/repo-looper.test.sh && tests/looper-dispatch.test.sh && tests/tacplus.test.sh && tests/planning-files.test.sh && tests/looper-build.test.sh && tests/looper-identity.test.sh && tests/runner-image.test.sh && tests/looper-recap.test.sh
      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build, smoke, push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          IMAGE=ghcr.io/tacplus-dev/looper
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"; MA="${V%%.*}"; MI="${V#*.}"; MI="${MI%%.*}"
            TAGS="$V $MA.$MI latest"
          else
            TAGS="main main-${GITHUB_SHA::7}"
          fi
          docker build --pull --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE:build" .
          # The smoke generates Go through the tacplus wrapper (looper#27): the host's
          # docker socket, a work directory at the same path here and there, and a
          # token for the releases list (inherited, on no command line).
          W="$RUNNER_TEMP/looper-work"; mkdir -p "$W"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$W:$W" -e LOOPER_WORK="$W" -e GH_TOKEN \
            "$IMAGE:build" looper-smoke
          for t in $TAGS; do docker tag "$IMAGE:build" "$IMAGE:$t"; docker push "$IMAGE:$t"; done
  report:
    needs: image
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open or update the bug issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./image-failed
