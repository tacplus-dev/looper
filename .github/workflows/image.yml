#
# Runs the tests, then builds the looper image on every push to main (main,
# main-<sha>) and on a vX.Y.Z tag (X.Y.Z, X.Y, latest), smoke-tests it, and
# pushes it to ghcr. arm64: the build hosts (this Mac under colima, the arm64
# runner) are arm64.
name: image
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: tests/looper-port.test.sh && tests/repo-looper.test.sh && tests/tacplus.test.sh && tests/planning-files.test.sh
      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build, smoke, push
        run: |
          set -eu
          IMAGE=ghcr.io/tacplus-dev/looper
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"; MA="${V%%.*}"; MI="${V#*.}"; MI="${MI%%.*}"
            TAGS="$V $MA.$MI latest"
          else
            TAGS="main main-${GITHUB_SHA::7}"
          fi
          docker build --pull --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE:build" .
          docker run --rm "$IMAGE:build" looper-smoke
          for t in $TAGS; do docker tag "$IMAGE:build" "$IMAGE:$t"; docker push "$IMAGE:$t"; done
