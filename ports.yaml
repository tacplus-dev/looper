#
# The port scan's mapping (looper-port; tacplus-dev/looper#2): every SeaBeam
# GitLab project under `source` that still receives commits, and the
# tacplus-dev repository its changes are carried into. Each mapped target's
# PROVENANCE.md holds the high-water mark, "Ported through `<sha>`" (before the
# first port, the migration commit it names: "<source>/<svc> at commit `<sha>`").
#
# A source with no target is listed under `unmapped`: its changes are reported
# once on the looper's tracking issue, never dropped. A project under `source`
# listed in no section is treated as unmapped too, and named as such. A source
# under `retired` is never ported and never reported: each line says why and
# when it was retired. Nothing comes over from SeaBeam that is not already in
# tacplus-dev, except stratum (Jody, 2026-10-27; looper#5).
#
# Shape (read by awk, keep it this simple): `key: value` lines, `ports:` with
# `  <svc>: <tacplus-dev repo>` lines, `unmapped:` and `retired:` with
# `  - <svc>` lines. A `# comment` may end any line.
source: seabeam/schematic/platform/services
target: tacplus-dev
ports:
  blobstore: blobstore
  eventbus: eventbus
  gateway: gateway
  kernel: kernel
  kmaker: kmaker
  letsencrypt: letsencrypt
  mailbox: mailbox
  messaging: messaging
  oauth: oauth
  opa: opa
  operator: operator
  stratum: stratum
unmapped:
retired:
  - anthropic-proxy  # not carried over; Jody, 2026-10-27 (looper#5)
  - argus  # not carried over; Jody, 2026-10-27 (looper#5)
  - echo  # not carried over; Jody, 2026-10-27 (looper#5)
  - github-proxy  # not carried over; Jody, 2026-10-27 (looper#5)
  - gitlab-connector  # not carried over; Jody, 2026-10-27 (looper#5)
  - gitlab-proxy  # not carried over; Jody, 2026-10-27 (looper#5)
  - graphdb  # boneyard; Jody, 2026-10-27 (looper#5)
  - harness  # tacplus-dev testing uses the default fleet, fleet-dev; Jody, 2026-10-27 (looper#5)
  - llmsettings  # dead; Jody, 2026-10-27 (looper#5)
  - msggateway  # not carried over; Jody, 2026-10-27 (looper#5)
  - openai-proxy  # not carried over; Jody, 2026-10-27 (looper#5)
  - personalauth  # dead; Jody, 2026-10-27 (looper#5)
  - saml  # not carried over; Jody, 2026-10-27 (looper#5)
  - sentinel  # boneyard; Jody, 2026-10-27 (looper#5)
  - timedb  # boneyard; Jody, 2026-10-27 (looper#5)
  - vanilla  # not carried over; Jody, 2026-10-27 (looper#5)
