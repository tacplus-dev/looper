#
# The tacplus-dev looper pipeline (gitlab.com/tacplus-dev/looper). The looper code and image live on GitHub
# (github.com/tacplus-dev/looper, ghcr.io/tacplus-dev/looper:main); this project only runs them, on the
# autoscaled runner registered to the tacplus-dev group. `looper-plan` lists the ready issues across
# tacplus-dev and writes a child pipeline with one job per repository (`looper-dispatch plan`, the
# code github.com/tacplus-dev/looper tests: looper#56); `looper-run` triggers it.
# This file is kept in github.com/tacplus-dev/looper as ci/tacplus-dev.gitlab-ci.yml and copied into
# this project as is, on its protected main, by the hub (README, Credentials).
# `looper-port` is the hourly port scan, `looper-kick` the kicker. Moved here from seabeam/tools/looper on 2026-10-27 (Jody: tacplus-dev
# must work by itself).
stages:
  - plan
  - run

# The tacplus-dev loopers (github.com/tacplus-dev/looper, image
# ghcr.io/tacplus-dev/looper:main). Every clone and build happens here, on the
# autoscaled runner, and nothing runs on the Mac (Jody 2026-10-29): the kicker
# schedule's `looper-kick` below starts this pipeline through the API when a
# repository has a ready issue and no looper job of its own. Nothing is passed
# as a pipeline variable.
#
# api/web/trigger: one job per tacplus-dev repository with a ready issue
# (approved, not held, every Blocked-by closed), working its oldest ready issue.
# resource_group is per repository: a repository's looper commits to main, so
# two of its runs never overlap. The next issue is taken by the next pipeline.
# schedule: the nightly scan of every repository (files issues, changes no code).
# The kicker schedule (description containing "kicker") runs only looper-kick
# below (tacplus-dev/looper#24). The hourly port-scan schedule (description containing "port scan"; schedules
# are told apart by CI_PIPELINE_SCHEDULE_DESCRIPTION, since pipeline variables
# are forbidden) runs only looper-port below (tacplus-dev/looper#2).
#
# LOOPER_WORK is under /builds, which the runner bind-mounts from the worker,
# so the containers repo-looper starts on the worker's docker (the `tacplus`
# wrapper) see the same checkout path.
#
# Each run's record (prompt.md, claude.log) is written under LOOPER_RUNS, in the
# job's project directory, and kept as the job's artifacts for 30 days, also when
# the job fails: the worker is gone after the job (tacplus-dev/looper#4).
#
# A looper job's timeout is its issue's limit plus an hour (`repo-looper
# --job-timeout`: a `Timeout: <hours>h` line in the issue, at most 10h, else 4h),
# so up to 11h; the project's maximum job timeout allows it (tacplus-dev/looper#7).
#
# FLEET_ID_TOKEN is the job's GitLab OIDC identity for our fleet (looper
# identity in roadmap/items/looper-hierarchy.md): to be exchanged at the
# kernel's cloud-auth facade for a platform token. Nothing consumes it yet;
# it is requested so the path is in place.
.looper-rules: &looper-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /port scan|kicker/
      when: never
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|trigger|api)$/
    - when: manual
      allow_failure: true

looper-plan:
  stage: plan
  image: ghcr.io/tacplus-dev/looper:main
  tags: [arm64, autoscale]
  retry:
    max: 2
    when: [runner_system_failure, scheduler_failure, unknown_failure]
  needs: []
  <<: *looper-rules
  # The plan's settings, reviewed with this file (looper#56): looper-dispatch
  # plan reads them, and gives the child's jobs the git identity.
  variables:
    GIT_STRATEGY: none
    LOOPER_ORG: tacplus-dev
    # Per-repository runner tags (looper#55): tacplus on the 16-CPU pool (runner 58307468).
    LOOPER_JOB_TAGS_tacplus: "arm64, autoscale-16"
    GIT_AUTHOR_NAME: jodydadescott
    GIT_AUTHOR_EMAIL: jody@thescottsweb.com
    GIT_COMMITTER_NAME: jodydadescott
    GIT_COMMITTER_EMAIL: jody@thescottsweb.com
  script:
    - looper-dispatch plan > looper-jobs.yml
    - cat looper-jobs.yml
  artifacts:
    paths: [looper-jobs.yml]
    expire_in: 1 week

looper-run:
  stage: run
  needs: [looper-plan]
  <<: *looper-rules
  trigger:
    include:
      - artifact: looper-jobs.yml
        job: looper-plan
    strategy: depend

# The port scan (github.com/tacplus-dev/looper, looper-port and ports.yaml):
# while SeaBeam still commits to its pre-migration projects, file a port issue
# on each tacplus-dev target. Mechanical, no model: reads SeaBeam with SEABEAM_READ_TOKEN
# (environment port-scan; looper#25), files issues with GH_TOKEN. One at a time (resource_group), so
# a slow scan never files the same issue twice.
looper-port:
  stage: plan
  image: ghcr.io/tacplus-dev/looper:main
  tags: [arm64, autoscale]
  retry:
    max: 2
    when: [runner_system_failure, scheduler_failure, unknown_failure]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /port scan/
  resource_group: looper-port
  environment: {name: port-scan, action: prepare}
  timeout: 30m
  variables:
    GIT_STRATEGY: none
  script:
    - looper-port

# The kicker (github.com/tacplus-dev/looper, looper-dispatch; tacplus-dev/looper#24):
# every 3 minutes, clear looper:in-progress from issues no looper job holds and
# start this pipeline when a repository has a ready issue and no looper job of
# its own. gitlab.com runs this group's schedules at most hourly, so the hourly
# kicker schedule's job makes a pass every 3 minutes for 57 minutes. Mechanical,
# no model: GH_TOKEN for the issues, GITLAB_TOKEN (read_api) for the jobs and
# LOOPER_TRIGGER_TOKEN (environment kicker; looper#25) to start the pipeline.
# Never two at once (resource_group): a late
# job's successor waits for it.
looper-kick:
  stage: plan
  image: ghcr.io/tacplus-dev/looper:main
  tags: [arm64, autoscale]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /kicker/
  resource_group: kicker
  environment: {name: kicker, action: prepare}
  retry:
    max: 2
    when: [runner_system_failure, scheduler_failure, unknown_failure]
  timeout: 75m
  variables:
    GIT_STRATEGY: none
  script:
    - looper-dispatch run --for 3420
