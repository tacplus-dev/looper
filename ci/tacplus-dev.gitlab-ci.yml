#
# The tacplus-dev looper pipeline (gitlab.com/tacplus-dev/looper). The looper code and image live on GitHub
# (github.com/tacplus-dev/looper, ghcr.io/tacplus-dev/looper); this project only runs them, on the
# autoscaled runner registered to the tacplus-dev group. `looper-plan` lists the ready issues across
# tacplus-dev and writes a child pipeline with a report job per ready issue, every one (no
# per-repository cap, looper#107), and each such repository's manager (`looper-dispatch plan`, the code
# github.com/tacplus-dev/looper tests: looper#56, looper#70); `looper-run` triggers it.
# This file is kept in github.com/tacplus-dev/looper as ci/tacplus-dev.gitlab-ci.yml and copied into
# this project as is, on its protected main, by the hub (README, Credentials).
# `looper-kick` is the kicker. Moved here from seabeam/tools/looper on 2026-10-27 (Jody: tacplus-dev
# must work by itself).
stages:
  - plan
  - run

# The tacplus-dev loopers (github.com/tacplus-dev/looper, image
# ghcr.io/tacplus-dev/looper). Every clone and build happens here, on the
# autoscaled runner, and nothing runs on the Mac (Jody 2026-10-29): the kicker
# schedule's `looper-kick` below starts this pipeline through the API when a
# repository has a ready issue and no looper job of its own. Nothing is passed
# as a pipeline variable.
#
# api/web/trigger (looper#70): one report job per ready issue (approved, not
# held, every Blocked-by closed), looper-<repo>-<issue>, every one (no cap,
# looper#107), each on its own branch and never on main (resource_group per issue), and
# the repository's manager, looper-<repo>-manager, the only job that merges to
# its main (resource_group looper-<repo>-main); with the apps, unless the
# repository's gates are build jobs, after its verdict job,
# looper-<repo>-verdict, which runs the batch's gates (looper#90). The kicker
# and the plan are the control jobs.
# schedule: the nightly scan of every repository (files issues, changes no code).
# The kicker schedule (description containing "kicker") runs only looper-kick
# below (tacplus-dev/looper#24; schedules are told apart by
# CI_PIPELINE_SCHEDULE_DESCRIPTION, since pipeline variables are forbidden).
#
# LOOPER_WORK is under /builds, which the runner bind-mounts from the worker,
# so the containers repo-looper starts on the worker's docker (the `tacplus`
# wrapper) see the same checkout path.
#
# Each run's record (prompt.md, claude.log) is written under LOOPER_RUNS, in the
# job's project directory, and kept as the job's artifacts for 30 days, also when
# the job fails: the worker is gone after the job (tacplus-dev/looper#4).
#
# A report job's timeout is its issue's limit plus an hour (`repo-looper
# --job-timeout`: a `Timeout: <hours>h` line in the issue, at most 10h, else 4h),
# so up to 11h, a manager's 11h; the project's maximum job timeout allows it
# (tacplus-dev/looper#7).
#
# The looper image by digest, never a tag (looper#115): GitHub runs a pushed
# branch's own copy of image.yml, which could push :main. This file's jobs run
# the digest it names, a reviewed change like build.lock's; the plan's jobs the
# attested build of main's head, which looper-dispatch plan verifies.
#
# FLEET_ID_TOKEN is the job's GitLab OIDC identity for our fleet (looper
# identity in roadmap/items/looper-hierarchy.md): to be exchanged at the
# kernel's cloud-auth facade for a platform token. Nothing consumes it yet;
# it is requested so the path is in place.
.looper-rules: &looper-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /kicker/
      when: never
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|trigger|api)$/
    - when: manual
      allow_failure: true

# Only the manager writes main (looper#83; README, Only the manager writes
# main): once the project has the apps (LOOPER_REPORT_APP_ID, ...), no job
# holds GH_TOKEN. Each job exchanges its id_token GCP_ID_TOKEN through Workload
# Identity Federation for its app's token (looper-token), and its environment
# names the app whose key GCP lets it sign with: looper-plan and kicker the
# report app's (tacplus-looper), as the plan's looper-report jobs (its
# reports, and its verdict jobs, which run a batch's gates: looper#90); the
# plan's looper-manager jobs the manager's (tacplus-manager, the only bypass of
# main's ruleset), which then run no repository code; its looper-scan jobs
# both. Until then the id_token goes unused.
.looper-identity:
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER

looper-plan:
  stage: plan
  image: ghcr.io/tacplus-dev/looper@sha256:bc0d0e03c7cda85d0e0e8fc0c973d6e7e5f88b83ad65cb69084dc9bcee8a8ef2
  tags: [arm64, autoscale]
  retry:
    max: 2
    when: [runner_system_failure, scheduler_failure, unknown_failure]
  needs: []
  <<: *looper-rules
  extends: .looper-identity
  environment: {name: looper-plan, action: prepare}
  # The plan's settings, reviewed with this file (looper#56): looper-dispatch
  # plan reads them, and gives the child's jobs the git identity.
  variables:
    GIT_STRATEGY: none
    LOOPER_ORG: tacplus-dev
    # Per-repository runner tags (looper#55): tacplus's reports on the 16-CPU pool (runner 58307468);
    # its manager and scan stay on LOOPER_JOB_TAGS's (looper#91: LOOPER_MANAGER_TAGS_tacplus would move the manager back).
    LOOPER_JOB_TAGS_tacplus: "arm64, autoscale-16"
    GIT_AUTHOR_NAME: jodydadescott
    GIT_AUTHOR_EMAIL: jody@thescottsweb.com
    GIT_COMMITTER_NAME: jodydadescott
    GIT_COMMITTER_EMAIL: jody@thescottsweb.com
  script:
    - looper-dispatch plan > looper-jobs.yml
    - cat looper-jobs.yml
  artifacts:
    paths: [looper-jobs.yml]
    expire_in: 1 week

looper-run:
  stage: run
  needs: [looper-plan]
  <<: *looper-rules
  trigger:
    include:
      - artifact: looper-jobs.yml
        job: looper-plan
    strategy: depend

# The kicker (github.com/tacplus-dev/looper, looper-dispatch; tacplus-dev/looper#24):
# every 3 minutes, clear looper:in-progress from issues no looper job holds and
# start this pipeline when a repository has a ready issue and no looper job of
# its own. gitlab.com runs this group's schedules at most hourly, so the hourly
# kicker schedule's job makes a pass every 3 minutes for 57 minutes. Mechanical,
# no model: GH_TOKEN for the issues (the report app's token with the apps,
# looper#83), GITLAB_TOKEN (read_api) for the jobs and
# LOOPER_TRIGGER_TOKEN (environment kicker; looper#25) to start the pipeline.
# Never two at once (resource_group), and only the newest (looper#104): a
# kick stops once a newer one is created, pending, waiting or running, so kicks
# that waited for a runner do not run their hours back to back.
looper-kick:
  stage: plan
  image: ghcr.io/tacplus-dev/looper@sha256:bc0d0e03c7cda85d0e0e8fc0c973d6e7e5f88b83ad65cb69084dc9bcee8a8ef2
  tags: [arm64, autoscale]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /kicker/
  resource_group: kicker
  environment: {name: kicker, action: prepare}
  extends: .looper-identity
  retry:
    max: 2
    when: [runner_system_failure, scheduler_failure, unknown_failure]
  timeout: 75m
  variables:
    GIT_STRATEGY: none
  script:
    - looper-dispatch run --for 3420

# The live check that main's ruleset holds against a report (looper#83;
# README, Only the manager writes main): with the report app's token, a
# contents API write to looper's main and a push of an empty commit to it must
# both be refused (looper-ruleset probe). Played by hand from a web pipeline,
# after the setup and whenever the ruleset or the apps change.
looper-ruleset-probe:
  stage: plan
  image: ghcr.io/tacplus-dev/looper@sha256:bc0d0e03c7cda85d0e0e8fc0c973d6e7e5f88b83ad65cb69084dc9bcee8a8ef2
  tags: [arm64, autoscale]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  extends: .looper-identity
  environment: {name: looper-report, action: prepare}
  variables:
    GIT_STRATEGY: none
  script:
    - 'test -z "${GH_TOKEN:-}" || { echo "this project still has GH_TOKEN, Jody''s token: delete it first (README)"; exit 1; }'
    - GH_TOKEN="$(looper-token mint report)" looper-ruleset probe looper

# The diagnosis of the apps' signing (looper#95): what GCP sees of a job in each
# environment that signs (its id_token's claims, the attribute.role the
# provider gitlab-looper computes from them) and each key's answer to a
# signature, against what its binding should give that environment
# (looper-token diagnose; no app, no GitHub). Played by hand from a web
# pipeline, before the probe: a job fails when a key's answer is not the
# expected one, and says why (gcloud's own error, its class).
looper-token-diagnose:
  stage: plan
  image: ghcr.io/tacplus-dev/looper@sha256:bc0d0e03c7cda85d0e0e8fc0c973d6e7e5f88b83ad65cb69084dc9bcee8a8ef2
  tags: [arm64, autoscale]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  extends: .looper-identity
  parallel:
    matrix:
      - LOOPER_ENVIRONMENT: [looper-plan, kicker, looper-report, looper-manager, looper-scan]
  environment: {name: $LOOPER_ENVIRONMENT, action: prepare}
  variables:
    GIT_STRATEGY: none
  script:
    - looper-token diagnose
