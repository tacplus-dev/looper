# The gate map of tacplus-dev/looper (looper#48; README: Gates scaled to the
# diff): the gates a land runs, chosen by the paths its diff changes. A path no
# set names, a change to this file, the nightly scan and every release run
# full. Each set's run is a shell command at the root of the checkout, with
# LOOPER_GATES_BASE the main the land is rebased on.
full:
  run: tests/looper-docker.test.sh && tests/looper-pkill.test.sh && tests/forge.test.sh && tests/repo-looper.test.sh && tests/looper-dispatch.test.sh && tests/tacplus.test.sh && tests/planning-files.test.sh && tests/looper-build.test.sh && tests/runner-image.test.sh && tests/looper-suggest.test.sh && tests/looper-trace.test.sh && tests/image-failed.test.sh && tests/looper-recap.test.sh && tests/looper-token.test.sh && tests/looper-ruleset.test.sh && tests/looper-ci-lint.test.sh && tests/looper-verify.test.sh
  minutes: 30
  paths: [/repo-looper, /looper-lib.sh, /looper-dispatch, /looper-docker, /looper-docker-broker, /looper-pkill, tests/looper-pkill.test.sh, /Dockerfile, tests/git-server.py, tests/forge.test.sh, tests/repo-looper.test.sh, tests/looper-dispatch.test.sh]
# The planning files and the docs: what CI checks of them.
docs:
  run: './planning-files-check "$LOOPER_GATES_BASE"'
  minutes: 1
  paths: ["*.md", /LICENSE]
planning-files:
  run: tests/planning-files.test.sh && ./planning-files-check "$LOOPER_GATES_BASE"
  minutes: 1
  paths: [/planning-files-check, tests/planning-files.test.sh, .github/workflows/planning-files.yml]
build:
  run: tests/looper-build.test.sh
  minutes: 5
  paths: [/looper-build, /looper-scan, tests/looper-build.test.sh, ci/build.gitlab-ci.yml]
# A job's app token and main's ruleset (looper#83); repo-looper and looper-dispatch, which use the token, are full's.
token:
  run: tests/looper-token.test.sh && tests/looper-ruleset.test.sh
  minutes: 1
  paths: [/looper-token, /looper-ruleset, tests/looper-token.test.sh, tests/looper-ruleset.test.sh]
tacplus:
  run: tests/tacplus.test.sh
  minutes: 2
  paths: [/tacplus, tests/tacplus.test.sh]
runner:
  run: tests/runner-image.test.sh
  minutes: 2
  paths: [/runner-image, runner/, tests/runner-image.test.sh]
# The suggestions' command (looper#50); the roadmap scan that runs it is repo-looper's, in full.
suggest:
  run: tests/looper-suggest.test.sh
  minutes: 1
  paths: [/looper-suggest, tests/looper-suggest.test.sh]
# The nightly recap's collection, classification and report (looper#57); the scan that runs it is repo-looper's, in full.
recap:
  run: tests/looper-recap.test.sh
  minutes: 1
  paths: [/looper-recap, tests/looper-recap.test.sh, tests/recap/]
# The GitLab CI files of ci/, linted as GitLab reads them (looper#94); the one the
# map gives another set is linted here too, the rest are full's.
ci:
  run: tests/looper-ci-lint.test.sh
  minutes: 1
  paths: [/looper-ci-lint, tests/looper-ci-lint.test.sh, ci/gitlab-ci.schema.json, ci/build.gitlab-ci.yml]
# The trace propagation check (looper#51); the prompts and the scan that run it are repo-looper's, in full.
trace:
  run: tests/looper-trace.test.sh
  minutes: 1
  paths: [/looper-trace, tests/looper-trace.test.sh]
# What a failed image build on main does (looper#58); the workflow itself runs only in Actions.
image:
  run: tests/image-failed.test.sh
  minutes: 1
  paths: [/image-failed, tests/image-failed.test.sh, .github/workflows/image.yml]
# A red formal verification filed as bugs (looper#74); the scan that runs it is repo-looper's, in full.
verify:
  run: tests/looper-verify.test.sh
  minutes: 1
  paths: [/looper-verify, tests/looper-verify.test.sh]
